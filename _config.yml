# Site
title:             Machine Gurning
masthead_title:    machinegurning.blog
description:       "A blog about data science, statistics, IoT and machine learning."
locale:            en-GB
url:               https://machinegurning.blog
logo:              /images/machinegurning.png
repository:        machinegurning/machinegurning.github.io

# Theme
remote_theme:          mmistakes/minimal-mistakes@4.28.1
minimal_mistakes_skin: default
search:                true

# Default author (posts override with `author: <key>` from _data/authors.yml)
author:
  name:   Machine Gurning
  avatar: /images/machinegurning.png
  bio:    "Two public-sector data scientists working through statistics, machine learning and the odd Raspberry Pi, in R and Python."
  links:
    - label: GitHub
      icon:  fab fa-fw fa-github
      url:   https://github.com/machinegurning

footer:
  links:
    - label: GitHub
      icon:  fab fa-fw fa-github
      url:   https://github.com/machinegurning

# Build
permalink:     /:categories/:title/
markdown:      kramdown
highlighter:   rouge
paginate:      10
paginate_path: /page:num/
timezone:      Europe/London
sass:
  style: compressed
kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

defaults:
  - scope: { path: "", type: posts }
    values:
      author_profile: true
      read_time:      true
      show_date:      true
      share:          false
      related:        true
  - scope: { path: "" }
    values:
      author_profile: true

include: [".htaccess"]
exclude: ["Gemfile", "Gemfile.lock", "LICENSE", "README.md", "CONTRIBUTING.md", "vendor", "_rmd", "_templates", ".claude"]
